<!-- Source for icon-512.png/icon-192.png/apple-touch-icon.png. Regenerate after any edit with:
       rsvg-convert -w 512 -h 512 icons/icon-source.svg -o icons/icon-512.png
       rsvg-convert -w 192 -h 192 icons/icon-source.svg -o icons/icon-192.png
       rsvg-convert -w 180 -h 180 icons/icon-source.svg -o icons/apple-touch-icon.png
     No self-drawn rounded corners or border on the outer square (a rounded corner + border did
     ship once — it got clipped unevenly by iOS's own corner mask, since the two roundings don't
     agree exactly; see CHANGELOG). Full-bleed square background instead, and let the OS apply
     its own mask on top. The purple (#341d79 — lightened from the original #241454 in v19.40,
     same hue/saturation with lightness raised ~9pt, because the original read as too dark)
     only shows in the square's corners outside the
     black circle behind the gear ring — deliberately not filling the whole square, so the badge
     reads as a distinct black-and-white-and-purple emblem sitting on a colored card, not a
     purple icon with a black hole in the middle. Gear ring: 12 teeth as plain filled circles
     sitting on a stroked base circle — simplest way to get an even, rounded-tooth cog silhouette
     without per-tooth bezier math. Mask face: a solid white plate (not just an outline — an
     outline-only version was tried first and read as a face, not a mask; the filled plate with
     black features painted on top reads as an actual mask at a glance) with a black stroke
     around its own edge so it stays visually separated from the black circle it sits on. Flat
     top, tapering to a rounded point at the chin, not a plain circle — the flat top is what
     reads as a mask/plate shape rather than a face outline. No eyebrows/nose/eye holes in the
     end — tried, but they cluttered the small-size read without adding to recognizability; the
     mustache carries the whole design. Goatee: a longer, narrower black point below the
     mustache, not the short teardrop tried earlier — reads more deliberately "pointed beard"
     instead of an ambiguous blob. -->
